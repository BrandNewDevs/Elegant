name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm run typecheck && pnpm run build && pnpm exec vitest run --project node --project renderer
        working-directory: app
      - run: python3 -m unittest discover -s evaluation -p 'test_*.py'
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: actions/cache@v4
        with:
          path: engine/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/Package*', 'engine/Sources/**', 'engine/Tests/**') }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm test
        working-directory: app
